<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification d'âge</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff8fab, #ffb3c6, #ff6b9d);
    font-family: -apple-system, 'Inter', sans-serif;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 28px;
    padding: 48px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .icon {
    font-size: 52px;
    margin-bottom: 20px;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  p {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn-yes {
    display: block;
    width: 100%;
    padding: 18px;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 100px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-yes:hover { background: rgba(255,255,255,0.35); }
  .btn-no {
    display: block;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-no:hover { color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔞</div>
  <h1>Contenu pour adultes</h1>
  <p>Ce site contient du contenu réservé aux personnes majeures. En continuant, vous confirmez avoir au moins 18 ans.</p>
  <a class="btn-yes" href="/go" target="_blank" rel="noreferrer noopener">J'ai 18 ans ou plus ✓</a>
  <a class="btn-no" href="https://www.google.com">Je suis mineur — quitter</a>
</div>
</body>
</html>
