<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    min-height: 100dvh;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overflow-x: hidden;
    position: relative;
    background: #f07aaa;
  }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .bg-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    filter: blur(2px) brightness(0.9) saturate(1.1);
    transform: scale(1.05);
  }

  .pink-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(to bottom, rgba(255,190,215,0.2) 0%, rgba(255,130,175,0.4) 100%);
  }

  .deco {
    position: fixed;
    z-index: 2;
    color: rgba(255,200,215,0.7);
    pointer-events: none;
    user-select: none;
    animation: float 4s ease-in-out infinite;
  }
  .deco-1 { top: 18%; left: 7%;  font-size: 36px; animation-delay: 0s; }
  .deco-2 { top: 35%; right: 8%; font-size: 48px; animation-delay: 1s; }
  .deco-3 { bottom: 30%; left: 10%; font-size: 44px; animation-delay: 2s; }
  .deco-4 { bottom: 16%; right: 7%; font-size: 32px; animation-delay: 0.5s; }
  .deco-5 { top: 10%; right: 20%; font-size: 28px; animation-delay: 1.5s; }
  .deco-6 { bottom: 45%; left: 5%; font-size: 24px; animation-delay: 3s; }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  .card {
    position: relative;
    z-index: 3;
    width: calc(100vw - 24px);
    max-width: 380px;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.55);
    border-radius: 28px;
    padding: 36px 20px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar {
    width: min(52vw, 190px);
    height: min(52vw, 190px);
    border-radius: 50%;
    object-fit: cover;
    object-position: center 10%;
    border: 4px solid rgba(255,255,255,0.95);
    box-shadow: 0 6px 30px rgba(0,0,0,0.35);
    margin-bottom: 20px;
    display: block;
  }

  .name {
    font-size: clamp(28px, 8vw, 38px);
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, #e8a0c0, #c060a0);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(180,60,120,0.5);
  }
  .badge svg { width: 18px; height: 18px; }

  .cta {
    display: block;
    width: 100%;
    margin-top: 24px;
    padding: 18px 24px;
    background: rgba(220,130,160,0.55);
    border: 1.5px solid rgba(255,255,255,0.5);
    border-radius: 100px;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.18s ease, transform 0.12s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .cta:hover { background: rgba(255,255,255,0.18); transform: scale(1.01); }

  /* ── MODALE ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .modal-card {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 28px;
    padding: 48px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    animation: slideUp 0.22s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(24px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .modal-icon { font-size: 52px; margin-bottom: 20px; }

  .modal-card h2 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .modal-card p {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn-yes {
    display: block;
    width: 100%;
    padding: 18px;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 100px;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-yes:hover { background: rgba(255,255,255,0.35); }

  .btn-no {
    display: block;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-no:hover { color: rgba(255,255,255,0.85); }

  @media (prefers-reduced-motion: reduce) {
    .deco { animation: none; }
    .cta, .modal-overlay, .modal-card { animation: none; transition: none; }
  }

  @media (max-width: 767px) {
    body { padding: 8px; }
    .card {
      width: calc(100vw - 24px);
      max-width: 360px;
      border-radius: 28px;
      padding: 36px 18px 32px;
    }
    .avatar { width: min(52vw, 170px); height: min(52vw, 170px); }
    .name { font-size: clamp(26px, 7vw, 34px); }
    .cta { font-size: 18px; padding: 16px 22px; margin-top: 20px; }
    .deco-1 { top: 3%; left: 2%; font-size: 28px; }
    .deco-2 { top: 15%; right: 2%; font-size: 36px; }
    .deco-3 { bottom: 18%; left: 2%; font-size: 32px; }
    .deco-4 { bottom: 4%; right: 3%; font-size: 26px; }
    .deco-5 { top: 2%; right: 15%; font-size: 20px; }
    .deco-6 { bottom: 32%; left: 1%; font-size: 18px; }
  }

  @media (min-width: 768px) {
    body { align-items: center; justify-content: center; padding: 40px; }
    .card {
      width: 340px;
      max-width: 340px;
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.5);
      padding: 32px 24px 28px;
      background: rgba(255,255,255,0.08);
    }
    .avatar { width: 160px; height: 160px; }
    .name { font-size: 30px; }
    .cta { font-size: 18px; padding: 16px 22px; margin-top: 20px; }
  }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="bg-layer">
  <img class="bg-photo" src="/bg.jpg" alt="">
</div>
<div class="pink-overlay"></div>

<span class="deco deco-1">✦</span>
<span class="deco deco-2">♡</span>
<span class="deco deco-3">♡</span>
<span class="deco deco-4">✦</span>
<span class="deco deco-5">✦</span>
<span class="deco deco-6">♡</span>

<div class="card">
  <img class="avatar" src="/avatar.jpg" alt="Anela Rain">
  <h1 class="name">Anela Rain
    <span class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </h1>
  <button class="cta" onclick="document.getElementById('ageModal').classList.add('active')">View More</button>
</div>

<!-- Modale vérification d'âge -->
<div class="modal-overlay" id="ageModal" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal-card">
    <div class="modal-icon">🔞</div>
    <h2 id="m-title"></h2>
    <p id="m-body"></p>
    <a class="btn-yes" id="m-yes" href="/go" target="_blank" rel="noreferrer noopener" onclick="document.getElementById('ageModal').classList.remove('active')"></a>
    <a class="btn-no" id="m-no" href="#" onclick="document.getElementById('ageModal').classList.remove('active');return false;"></a>
  </div>
</div>
