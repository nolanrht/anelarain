<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anela Rain</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F7FKVJ9F6Y"></script>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 600px;
    padding: 20px 16px 8px;
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #111;
    font-style: italic;
  }

  .nav-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0;
    color: #111;
    border-radius: 50%;
    transition: background 0.15s;
  }
  .nav-btn:hover { background: #f0f0f0; }

  /* hamburger lines */
  #menuBtn span {
    display: block;
    width: 20px;
    height: 2px;
    background: #111;
    border-radius: 2px;
  }

  .search-bar {
    display: none;
    padding: 10px 0 4px;
  }
  .search-bar.active { display: block; }

  .search-bar input {
    width: 100%;
    padding: 10px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 100px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    outline: none;
    background: #f7f7f7;
    color: #111;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: #111; background: #fff; }

  /* Sidebar menu */
  .menu-sidebar {
    display: none;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 220px;
    background: #fff;
    box-shadow: 4px 0 24px rgba(0,0,0,0.10);
    z-index: 200;
    flex-direction: column;
    padding: 80px 0 32px;
  }
  .menu-sidebar.active { display: flex; }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 199;
    background: rgba(0,0,0,0.18);
  }
  .sidebar-overlay.active { display: block; }

  .menu-item {
    display: block;
    padding: 16px 28px;
    font-size: 16px;
    font-weight: 700;
    color: #111;
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  .menu-item:hover { background: #f5f5f5; }

  /* Instagram bubble */
  .insta-bubble {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1.5px solid #e8e8e8;
    border-radius: 50%;
    padding: 8px;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    margin: 8px auto 0;
    width: 44px;
    height: 44px;
    transition: box-shadow 0.15s;
  }
  .insta-bubble:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.13); }
  .insta-icon {
    width: 24px; height: 24px;
    flex-shrink: 0;
  }

  .grid {
    width: 100%;
    max-width: 600px;
    padding: 16px 16px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .grid-center {
    padding: 0 16px 32px;
    display: flex;
    justify-content: center;
  }

  .grid-center .tile {
    width: calc(50% - 6px);
  }


  .tile {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1/1;
    cursor: pointer;
    text-decoration: none;
    display: block;
    background: #111;
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0.92;
  }

  .tile:hover img {
    transform: scale(1.04);
    opacity: 1;
  }

  .tile-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 28px 14px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* Modale */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }

  .modal-icon { font-size: 48px; margin-bottom: 16px; }

  .modal-card h2 {
    color: #111;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .modal-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .btn-yes {
    display: block;
    width: 100%;
    padding: 16px;
    background: #111;
    border-radius: 100px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .btn-no {
    display: block;
    color: #999;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }
</style>
<script defer src="/_vercel/insights/script.js"></script>
<script>
function toggleMenu() {
  document.getElementById('menuDropdown').classList.toggle('active');
  document.getElementById('sidebarOverlay').classList.toggle('active');
  document.getElementById('searchBar').classList.remove('active');
}
function toggleSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.toggle('active');
  document.getElementById('menuDropdown').classList.remove('active');
  if (bar.classList.contains('active')) document.getElementById('searchInput').focus();
}
</script>
</head>
<body>

<header>
  <div class="nav">
    <button class="nav-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <h1>anela rain</h1>
    <button class="nav-btn" id="searchBtn" onclick="toggleSearch()" aria-label="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
  </div>
  <div class="search-bar" id="searchBar">
    <input type="text" placeholder="Search…" id="searchInput" autocomplete="off">
  </div>
</header>

<!-- Sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMenu()"></div>

<!-- Sidebar menu -->
<div class="menu-sidebar" id="menuDropdown">
  <a href="/" class="menu-item">Home</a>
</div>

<div class="grid">
  <a class="tile" href="https://x.com/anelarain?s=11" target="_blank" rel="noreferrer noopener">
    <img src="/tile_x.jpg" alt="X">
    <div class="tile-label">X</div>
  </a>
  <a class="tile" href="https://www.instagram.com/anelaraiin" target="_blank" rel="noreferrer noopener">
    <img src="/tile_insta.jpg" alt="Instagram">
    <div class="tile-label">Instagram</div>
  </a>
</div>
<div class="grid grid-center">
  <a class="tile" href="#" onclick="document.getElementById('ageModal').classList.add('active');return false;">
    <img src="/tile_of.jpg" alt="Exclusive Content">
    <div class="tile-label">Exclusive Content</div>
  </a>
</div>

<!-- Age modal -->
<div class="modal-overlay" id="ageModal" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal-card">
    <div class="modal-icon">🔞</div>
    <h2 id="m-title"></h2>
    <p id="m-body"></p>
    <a class="btn-yes" id="m-yes" href="/go" target="_blank" rel="noreferrer noopener" onclick="document.getElementById('ageModal').classList.remove('active')"></a>
    <a class="btn-no" id="m-no" href="#" onclick="document.getElementById('ageModal').classList.remove('active');return false;"></a>
  </div>
</div>

<script>
(function(){
  var i18n = {
    fr: { title:"Contenu pour adultes", body:"Ce site contient du contenu réservé aux personnes majeures. En continuant, vous confirmez avoir au moins 18 ans.", yes:"J'ai 18 ans ou plus ✓", no:"Je suis mineur — fermer" },
    en: { title:"Adult content", body:"This site contains content intended for adults only. By continuing, you confirm that you are at least 18 years old.", yes:"I am 18 or older ✓", no:"I am a minor — close" },
    es: { title:"Contenido para adultos", body:"Este sitio contiene contenido exclusivo para mayores de edad.", yes:"Tengo 18 años o más ✓", no:"Soy menor de edad — cerrar" },
    de: { title:"Erwachseneninhalt", body:"Diese Seite enthält Inhalte nur für Erwachsene.", yes:"Ich bin 18 oder älter ✓", no:"Ich bin minderjährig — schließen" },

</script>

</body>
</html>
