<head>

<script>
  window.dataLayer = window.dataLayer || [];

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 600px;
    padding: 28px 20px 8px;
    text-align: center;
  }

  header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #111;
    font-style: italic;
  }

  .grid {
    width: 100%;
    max-width: 600px;
    padding: 16px 16px 32px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .tile {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    aspect-ratio: 1/1;
    cursor: pointer;
    text-decoration: none;
    display: block;
    background: #111;
  }

  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease, opacity 0.3s ease;
    opacity: 0.92;
  }

  .tile:hover img {
    transform: scale(1.04);
    opacity: 1;
  }

  .tile-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 28px 14px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  /* Modale */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #fff;
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 320px;
    width: 100%;
    text-align: center;
  }

  .modal-icon { font-size: 48px; margin-bottom: 16px; }

  .modal-card h2 {
    color: #111;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .modal-card p {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .btn-yes {
    display: block;
    width: 100%;
    padding: 16px;
    background: #111;
    border-radius: 100px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .btn-no {
    display: block;
    color: #999;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<header>
  <h1>anela rain</h1>
</header>

<div class="grid">
  <a class="tile" href="https://x.com/anelarain?s=11" target="_blank" rel="noreferrer noopener">
    <img src="/tile_twitter.jpg" alt="X">
    <div class="tile-label">X</div>
  </a>
  <a class="tile" href="#" onclick="document.getElementById('ageModal').classList.add('active');return false;">
    <img src="/tile_of.jpg" alt="Exclusive Content">
    <div class="tile-label">Exclusive Content</div>
  </a>
</div>

<!-- Age modal -->
<div class="modal-overlay" id="ageModal" onclick="if(event.target===this)this.classList.remove('active')">
  <div class="modal-card">
    <div class="modal-icon">🔞</div>
    <h2 id="m-title"></h2>
    <p id="m-body"></p>
    <a class="btn-yes" id="m-yes" href="/go" target="_blank" rel="noreferrer noopener" onclick="document.getElementById('ageModal').classList.remove('active')"></a>
    <a class="btn-no" id="m-no" href="#" onclick="document.getElementById('ageModal').classList.remove('active');return false;"></a>
  </div>
</div>

<script>
(function(){
  var i18n = {
    fr: { title:"Contenu pour adultes", body:"Ce site contient du contenu réservé aux personnes majeures. En continuant, vous confirmez avoir au moins 18 ans.", yes:"J'ai 18 ans ou plus ✓", no:"Je suis mineur — fermer" },
    en: { title:"Adult content", body:"This site contains content intended for adults only. By continuing, you confirm that you are at least 18 years old.", yes:"I am 18 or older ✓", no:"I am a minor — close" },
    es: { title:"Contenido para adultos", body:"Este sitio contiene contenido exclusivo para mayores de edad.", yes:"Tengo 18 años o más ✓", no:"Soy menor de edad — cerrar" },
    de: { title:"Erwachseneninhalt", body:"Diese Seite enthält Inhalte nur für Erwachsene.", yes:"Ich bin 18 oder älter ✓", no:"Ich bin minderjährig — schließen" },
    pt: { title:"Conteúdo adulto", body:"Este site contém conteúdo reservado a maiores de idade.", yes:"Tenho 18 anos ou mais ✓", no:"Sou menor de idade — fechar" },
    it: { title:"Contenuto per adulti", body:"Questo sito contiene contenuti riservati ai maggiorenni.", yes:"Ho 18 anni o più ✓", no:"Sono minorenne — chiudi" }
  };
  var lang = (navigator.language || 'en').slice(0,2).toLowerCase();
  var t = i18n[lang] || i18n['en'];
  document.getElementById('m-title').textContent = t.title;
  document.getElementById('m-body').textContent  = t.body;
  document.getElementById('m-yes').textContent   = t.yes;
  document.getElementById('m-no').textContent    = t.no;
})();
</script>

</body>
</html>
